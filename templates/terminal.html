{% extends 'base.html' %}
{% block head %}
<link rel="stylesheet" href="/assets/site-terminal.css?v=wsl1">
<script src="/assets/site-terminal.js?v=wsl1" defer></script>
{% endblock %}
{% block content %}
<section class="shell-page" aria-labelledby="shell-title">
  <h1 class="sr-only" id="shell-title">{{ ui.site_terminal }}</h1>
  <div class="shell-window" data-web-shell hidden>
    <div class="shell-bar"><span class="shell-tab"><b aria-hidden="true">&gt;_</b> Ubuntu</span><span id="shell-path">/</span></div>
    <div id="shell-screen" tabindex="0" role="region" aria-label="{{ ui.site_terminal }}">
      <div id="shell-log" role="log" aria-label="{{ ui.site_terminal }}" aria-live="polite"></div>
      <form id="shell-form" autocomplete="off">
        <label for="shell-input"><span class="sr-only">{{ ui.command }} </span><span class="shell-prompt"><span class="prompt-user">river_ya@knowledge</span>:<span class="prompt-dir">~</span>$</span></label>
        <span class="shell-edit">
          <input id="shell-input" name="command" type="text" maxlength="512" autocapitalize="off" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-describedby="shell-hint">
          <span class="shell-mirror" hidden aria-hidden="true"><span class="cursor-prefix"></span><span class="block-cursor"></span></span>
        </span>
      </form>
    </div>
    <div class="shell-shortcuts">
      <div>{% for example in ['help','ls','search diffusion'] %}<button type="button" data-command="{{ example }}">{{ example }}</button>{% endfor %}</div>
      <small id="shell-hint">{{ ui.terminal_keys }}</small>
      <button class="shell-run" type="submit" form="shell-form" aria-label="{{ ui.run_command }}">{{ ui.terminal_submit }} ↵</button>
    </div>
  </div>
  <noscript><p>{{ ui.terminal_noscript }}</p><ul>{% for path in ['/ai','/algorithms','/infra','/blog'] %}<li><a href="{{ catalog[path].url }}">{{ catalog[path].title }}</a></li>{% endfor %}</ul></noscript>
  <script id="shell-catalog" type="application/json">{{ catalog|tojson }}</script>
</section>
{% endblock %}
