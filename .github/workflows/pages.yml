name: Validate and deploy GitHub Pages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Validate content
        run: python scripts/validate.py
      - name: Test authoring workflows
        run: python -B -m unittest discover -s tests -v
      - name: Build static site
        run: python scripts/build.py
      - name: Crawl static routes and metadata
        run: python scripts/validate.py --output
      - name: Install browser checks
        run: |
          python -m pip install -r requirements-browser.lock
          python -m playwright install --with-deps chromium
      - name: Check responsive layout and interactions
        run: |
          python scripts/browser_check.py
          python scripts/dock_check.py
          python scripts/blog_check.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
